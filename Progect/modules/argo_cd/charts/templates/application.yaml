apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: { { .Values.namespace } }
spec:
  project: default
  source:
    repoURL: { { .Values.repoURL } }
    targetRevision: { { .Values.targetRevision } }
    path: { { .Values.path } }
  destination:
    server: https://kubernetes.default.svc
    namespace: { { .Values.destinationNS } }
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
